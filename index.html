<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec">
  <!-- Night mode: the saved choice, else the phone's setting. Set before the page draws so it never flashes. -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('recipeapp.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
  <title>Recipes</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2026-10-22b">
</head>
<body>
  <main id="app"></main>

  <nav class="nav">
    <a href="#/" data-tab="recipes"><span class="ico" data-ic="book"></span>Recipes</a>
    <a href="#/list" data-tab="list"><span class="ico" data-ic="basket"></span>Shopping</a>
    <a href="#/me" data-tab="me"><span class="ico" data-ic="me"></span>Profile</a>
  </nav>

  <!-- ?v= makes phones fetch fresh files after an update: change it whenever the site changes. -->
  <!-- Plain scripts (no build step) so this also works by double-clicking index.html. -->
  <script src="js/icons.js?v=2026-10-22b"></script>
  <script src="js/data.js?v=2026-10-22b"></script>
  <script src="js/util.js?v=2026-10-22b"></script>
  <script src="js/store.js?v=2026-10-22b"></script>
  <!-- Cross-device sync (Firebase). Works offline; skipped if not configured. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=2026-10-22b"></script>
  <script src="js/sync.js?v=2026-10-22b"></script>
  <script src="js/ui.js?v=2026-10-22b"></script>
  <script src="js/importer.js?v=2026-10-22b"></script>
  <script src="js/views/library.js?v=2026-10-22b"></script>
  <script src="js/views/recipe.js?v=2026-10-22b"></script>
  <script src="js/edit.js?v=2026-10-22b"></script>
  <script src="js/views/shopping.js?v=2026-10-22b"></script>
  <script src="js/views/profile.js?v=2026-10-22b"></script>
  <script src="js/app.js?v=2026-10-22b"></script>
</body>
</html>
